name: AI code review

# Reviews the lines a pull request changes with a local Ollama model (no API key,
# nothing leaves the runner) and publishes the findings as GitHub code-scanning alerts.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      path:
        description: "Directory to review in full (manual runs)"
        default: "."

permissions:
  contents: read
  security-events: write   # upload SARIF

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override with a repository variable: Settings → Secrets and variables → Actions → Variables.
  # CPU-only runners: 7-8B models are practical; larger ones (phi4) are slow but work.
  OLLAMA_MODEL: ${{ vars.REVIEW_MODEL || 'qwen2.5:7b' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (nohup ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf localhost:11434/api/tags >/dev/null && break
            sleep 1
          done

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Pull model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Review
        id: review
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            TARGET="--diff $BASE"
          else
            TARGET="${{ inputs.path }}"
          fi
          # --fail-on never: always produce the report; alerts carry the severity.
          python cli.py $TARGET --format sarif -o review.sarif --fail-on never
          # Same run again: served from the result cache, so this is instant.
          python cli.py $TARGET --format markdown --fail-on never >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        # Fork PRs get a read-only token and cannot upload; they still get the job summary.
        if: always() && hashFiles('review.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: review.sarif
          category: ai-code-review

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-sarif
          path: review.sarif
          if-no-files-found: ignore
